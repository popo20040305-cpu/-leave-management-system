<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title, link, style)">
    <th:block th:if="${title == null}">
        <title>请假管理系统</title>
    </th:block>
    <th:block th:if="${title != null}">
        <title th:replace="${title}">title</title>
    </th:block>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="请假管理系统" />
    <meta name="keywords" content="请假管理系统, SpringBoot, ，mybatis-plus, Thymeleaf, Shiro" />
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/style.css}"  media="all">
    <script th:src="@{/js/jquery.js}" charset="utf-8"></script>
    <script type="text/javascript" th:src="@{/js/common.js}"></script>
    <script th:inline="javascript">

        // 注入权限数据
        var userPermissions = /*[[${userPermissions}]]*/ || [];
        //注入角色
        var userRoles = /*[[${userRoles}]]*/ || [];

        var loginUser = /*[[${userRoles}]]*/ || [];

        console.log('当前用户权限:', userPermissions);

        // 权限检查函数
        function hasPermission(perm) {
            if (!userPermissions || userPermissions.length === 0) return false;
            return userPermissions.indexOf(perm) !== -1;
        }

        function hasAnyPermission() {
            var perms = Array.prototype.slice.call(arguments);
            return perms.some(function(perm) {
                return hasPermission(perm);
            });
        }

        function hasAllPermissions() {
            var perms = Array.prototype.slice.call(arguments);
            return perms.every(function(perm) {
                return hasPermission(perm);
            });
        }

    </script>

    <th:block th:if="${link != null}">
        <th:block th:replace="${link}"></th:block>
    </th:block>
    <th:block th:if="${style != null}">
        <th:block th:replace="${style}"></th:block>
    </th:block>
</head>
<body>
</body>
</html>
