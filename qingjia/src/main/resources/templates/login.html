<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>欢迎登录后台管理系统</title>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
    <script language="JavaScript" src="js/jquery.js"></script>
    <script src="js/cloud.js" type="text/javascript"></script>

    <script>
        // 登录框居中（原生版）
        function centerBox() {
            var box = document.querySelector('.loginbox');
            if (box) {
                box.style.position = 'absolute';
                box.style.left = (window.innerWidth - 692) / 2 + 'px';
            }
        }
        window.addEventListener('load', centerBox);
        window.addEventListener('resize', centerBox);

        // ajax 登录（fetch 版，不依赖 jQuery）
        window.addEventListener('load', function () {
            document.querySelector('.loginbtn').addEventListener('click', function (e) {
                e.preventDefault();
                var data = new URLSearchParams();
                data.append('username', document.querySelector('.loginuser').value);
                data.append('password', document.querySelector('.loginpwd').value);
                data.append('request_source', 'jquery');
                fetch('login.html', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: data
                })
                    .then(function (r) { return r.json(); })
                    .then(function (res) {
                        if (res.code === 200 && res.token) {
                            sessionStorage.setItem('token', res.token);
                            location.href = './';
                        } else { alert(res.msg); }
                    })
                    .catch(function () { alert('登录失败'); });
            });
        });
    </script>
</head>

<body style="background-color:#1c77ac; background-image:url(../static/images/light.png); background-repeat:no-repeat; background-position:center top; overflow:hidden;">


<div id="mainBody">
    <div id="cloud1" class="cloud"></div>
    <div id="cloud2" class="cloud"></div>
</div>


<div class="logintop">
    <span>欢迎登录后台管理界面平台</span>
    <ul>
        <li><a href="#">回首页</a></li>
        <li><a href="#">帮助</a></li>
        <li><a href="#">关于</a></li>
    </ul>
</div>

<div class="loginbody">

    <span class="systemlogo"></span>

    <div class="loginbox">
        <form th:action="@{/login.html}" method="post">
            <ul>
                <li><input name="username" type="text" class="loginuser" value="1997013"
                           onclick="JavaScript:this.value=''"/></li>
                <li><input name="password" type="text" class="loginpwd" value="123456" onclick="JavaScript:this.value=''"/>
                </li>
                <li><input name="" type="submit" class="loginbtn" value="登录"/>
                    <label><input name="" type="checkbox" href="#">忘记密码？</a></label>
                </li>
            </ul>
        </form>
    </div>
</div>


<div class="loginbm">版权所有 2013 <a href="http://www.uimaker.com">uimaker.com</a> 仅供学习交流，勿用于任何商业用途</div>


</body>

</html>
